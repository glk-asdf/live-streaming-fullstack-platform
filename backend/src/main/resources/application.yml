server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: live-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:live}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# 媒体服务器对外地址：P3 起用于下发推流/播放地址
live:
  jwt:
    # HMAC 签名要求至少 256 位（32 字节），实际算法由密钥长度决定；生产必须用环境变量覆盖
    secret: ${JWT_SECRET:live-dev-only-secret-key-change-me-in-production-2026}
    access-expire-seconds: ${JWT_ACCESS_EXPIRE:1800}
    refresh-expire-seconds: ${JWT_REFRESH_EXPIRE:604800}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:live-public}
    public-base: ${MINIO_PUBLIC_BASE:http://127.0.0.1:9000/live-public}
  media:
    rtmp-host: ${MEDIA_RTMP_HOST:localhost}
    rtmp-port: ${MEDIA_RTMP_PORT:1935}
    hls-base: ${MEDIA_HLS_BASE:http://localhost:8888}
    webrtc-base: ${MEDIA_WEBRTC_BASE:http://localhost:8889}
    api-base: ${MEDIA_API_BASE:http://127.0.0.1:9997}
    callback-token: ${MEDIA_CALLBACK_TOKEN:dev-media-callback-token}

logging:
  level:
    com:
      example:
        live: debug
