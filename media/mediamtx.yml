# MediaMTX 1.21 配置（P3：RTMP 推流 + LL-HLS/WHEP + HTTP 鉴权 + 事件回调）
# 推流：rtmp://localhost:1935/live/{roomId}?key={streamKey}（已启用鉴权）
# 播放：LL-HLS http://localhost:8888/live/{roomId}/index.m3u8
#       WHEP   http://localhost:8889/live/{roomId}/whep
# 管理 API 只监听回环地址，不对外暴露。

logLevel: info

api: yes
apiAddress: 127.0.0.1:9997

# 推流/播放鉴权交给后端；api/metrics/pprof 排除，避免后端对账与踢流被自己拦截
authMethod: http
authHTTPAddress: http://127.0.0.1:8080/api/v1/media/auth?token=dev-media-callback-token
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

rtsp: no
rtmp: yes
rtmpAddress: :1935

hls: yes
hlsAddress: :8888
hlsVariant: lowLatency
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentCount: 7
hlsAllowOrigins: ["*"]

webrtc: yes
webrtcAddress: :8889
webrtcAdditionalHosts: [127.0.0.1]
webrtcAllowOrigins: ["*"]

srt: no
# 默认开启的 MoQ 会额外监听 8892/8893 并生成自签证书，首版不需要
moq: no

# 推流上下线事件回调后端；脚本读取 MediaMTX 注入的 MTX_PATH
pathDefaults:
  runOnOnline: powershell -NoProfile -ExecutionPolicy Bypass -File notify.ps1 -Event online
  runOnOffline: powershell -NoProfile -ExecutionPolicy Bypass -File notify.ps1 -Event offline

# P8 起按房间追加录制配置
paths:
  all_others:
